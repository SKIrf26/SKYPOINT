  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5cf2ff"/><stop offset="1" stop-color="#9d7bff"/></linearGradient>
  <linearGradient id="skw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5cf2ff"/><stop offset="1" stop-color="#9d7bff"/></linearGradient>
  <linearGradient id="barL" x1="0" x2="1"><stop offset="0" stop-color="#9d7bff"/><stop offset="1" stop-color="#5cf2ff"/></linearGradient>
